# OnlySay RAG MVP 配置文件
# 复制此文件为 application-local.properties 并填入真实 API Key，或直接修改本文件

# DeepSeek 配置（OpenAI 兼容 API）
deepseek.api-key=sk-your-deepseek-api-key-here
deepseek.base-url=https://api.deepseek.com/v1
deepseek.model=deepseek-v4-flash

# Embedding 模型配置
# 本地 ONNX 模型，首次运行自动下载到 ~/.langchain4j/
# bge-small-zh-v1.5 是中文优化模型，适合中文场景
embedding.model-name=bge-small-zh-v1.5

# 检索配置
retrieval.max-results=3
retrieval.min-score=0.5

# PostgreSQL + pgvector 向量库配置
# 已在本机通过源码编译安装 pgvector v0.8.6（PostgreSQL 14）
# 数据库/用户/扩展均已就绪，后续迁移 EmbeddingStore 到此库即可启用
pg.host=localhost
pg.port=5432
pg.database=onlysay
pg.user=onlysay
pg.password=onlysay_dev_2026

# ===== 意图识别配置（三级漏斗）=====
# 总开关：false 时 /api/generate 跳过识别直接生成（旧行为，用于回滚）
intent.enabled=true
# 第二级分类器：llm（deepseek-v4-flash 轻量分类）| none（跳过，规则未命中直接进第三级）
intent.classifier=llm
# 第二级轻量分类模型（非思考模式）
intent.classifier.model=deepseek-v4-flash
# 第三级 LLM 兜底复核模型（处理 0.60-0.85 模糊区间）
intent.llm.model=deepseek-v4-pro
# 第三级 LLM 兜底每日调用上限
intent.llm.daily-limit=5000
# 识别结果精确匹配缓存容量（LRU）
intent.cache.size=1000
